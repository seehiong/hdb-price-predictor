[project]
name = "hdb-price-predictor"
version = "0.2.0"
description = "Singapore Property Price Predictor with in-browser XGBoost and dual-mode valuation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26.4,<2",
    "pandas>=2.1.4",
    "joblib>=1.4.2",
    "xgboost>=2.0.3",
    "scikit-learn>=1.4.0,<1.7.0",
    "rich>=13.7.1",
]

[tool.uv]
managed = true
